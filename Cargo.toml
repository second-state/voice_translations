# This package is a pure library: the speech pipeline (VAD assets, ASR,
# streaming LLM translation, TTS) that every app in this workspace builds on.
# The apps live in subfolders, each a standalone binary with its own
# configuration file:
#   conf-translations     — the conference-call translator
#   medical-translations  — the patient/clinician interpreter
#   medical-saas          — the interpreter as a hosted service: accounts,
#                           magic-link login, weekly word quota, Stripe plans
# `cargo build --release` builds both into target/release/.
[workspace]
members = ["conf_translations", "medical_saas", "medical_translations"]
default-members = [".", "conf_translations", "medical_saas", "medical_translations"]

[package]
name = "voice-translations"
version = "0.2.0"
edition = "2021"
description = "Real-time speech transcription and translation over OpenAI-compatible ASR/LLM/TTS services"
repository = "https://github.com/second-state/voice_translations"
license = "Apache-2.0"

# A library that Axum apps build domain-specific translators on (see
# `conf_translations` and `medical_translations`). There is no binary here.
[lib]
name = "voice_translations"
path = "src/lib.rs"

[features]
# Assets are embedded by default so the app binaries built on this library
# are self-contained: they run from any directory with nothing beside them
# but a config file.
default = ["embed-assets"]
# Compile the Silero VAD + onnxruntime-web assets in and expose
# `assets::vendor_router()`. Dependent crates need this, since they cannot
# reach this crate's source tree at runtime.
embed-assets = []

[dependencies]
# Web server
axum = { version = "0.8", features = ["multipart"] }
tower-http = { version = "0.6", features = ["fs"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tokio-stream = "0.1"
futures = "0.3"
bytes = "1"

# Upstream HTTP (ASR + LLM)
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "multipart",
    "stream",
    "rustls-tls",
] }

# Serialization / config
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Errors / logging
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
