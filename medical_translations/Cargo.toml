[package]
name = "medical-translations"
version = "0.1.6"
edition = "2021"
description = "Real-time translation for patient/clinician conversations, tuned per medical specialty"
license = "Apache-2.0"

[dependencies]
# The speech pipeline (VAD assets, ASR, streaming LLM translation, TTS) comes
# from the upstream voice translator; this crate supplies the medical domain
# knowledge on top of it. `embed-assets` compiles the Silero VAD and
# onnxruntime-web files into this binary, since the upstream `vendor/` tree is
# not reachable at runtime from a dependency.
#
# Building from a clone of this app alone? Swap the path for the git source:
#   voice-translations = { git = "https://github.com/second-state/voice_translations", features = ["embed-assets"] }
voice-translations = { path = "..", features = ["embed-assets"] }

# Web server
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

# Serialization / config
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Errors / logging
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
