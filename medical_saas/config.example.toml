# Copy this file to config.toml and fill in your credentials.
# config.toml is git-ignored and must never be committed.
#
# The [server] [audio] [asr] [llm] [tts] sections are the upstream
# voice_translations settings; [medical] is this app's own.

[server]
host = "127.0.0.1"
# Deliberately not 8080: the general-purpose voice-translations app defaults to
# that, and the two are meant to be able to run side by side.
port = 8100

[audio]
# Silence duration (ms) that ends a sentence/utterance. Clinical speech has
# more thinking pauses than casual conversation — a clinician working out a
# dose, a patient recalling when a symptom started — so the default is
# generous. Lower it if turns feel slow to come back.
sentence_break_ms = 1200
# Utterances shorter than this (ms) are discarded as noise.
min_speech_ms = 250
# Force a sentence break if one utterance runs longer than this (ms).
max_utterance_ms = 30000
# Silero VAD speech probability above which a frame counts as speech (0-1).
# Lower it (e.g. 0.35) to pick up a patient speaking quietly from across an
# exam room; raise it (e.g. 0.6) in a noisy ward.
vad_positive_threshold = 0.5
# Silero VAD speech probability below which a frame counts as silence (0-1).
# Keep it below vad_positive_threshold.
vad_negative_threshold = 0.35
# Audio (ms) prepended before the detected speech onset so the first syllable
# is not clipped.
pre_speech_pad_ms = 300

[medical]
# Specialty selected when the page loads. Valid ids:
#   primary_care, emergency, pediatrics, cardiology, oncology, orthopedics,
#   dentistry, obgyn, psychiatry, dermatology, gastroenterology, neurology,
#   endocrinology, pulmonology, ophthalmology, urology_nephrology, pharmacy,
#   anesthesia, physical_therapy
default_specialty = "primary_care"

# The two sides of the encounter. ISO 639-1 codes or full names both work.
clinician_language = "en"
patient_language = "es"

# Languages offered in the two pickers. The two above are always included.
# Trim this to the languages your clinic actually sees.
languages = [
    "en", "es", "zh", "yue", "vi", "tl", "ko", "ar", "ru", "ht",
    "pt", "fr", "hi", "bn", "ur", "fa", "ja", "so", "am", "ne",
    "my", "uk", "pl", "de", "it",
]

# Optional distinct voices for read-aloud, so the room can hear which side a
# rendered turn belongs to. Both fall back to [tts] voice.
#clinician_voice = "alloy"
#patient_voice = "nova"

[asr]
# OpenAI-compatible base URL; the server appends /audio/transcriptions.
endpoint = "https://api.example.com/v1"
api_key = "your-asr-api-key"
model = "whisper-1"

[llm]
# OpenAI-compatible base URL; the server appends /chat/completions.
endpoint = "https://api.example.com/v1"
api_key = "your-llm-api-key"
model = "gpt-4o-mini"
# How many past turns of this encounter to include as context.
context_messages = 5
# Sampling temperature. Interpreting wants the literal reading, not a creative
# one; if your model honors it, keep this low.
temperature = 0.2

[tts]
# OpenAI-compatible base URL; the server appends /audio/speech.
# Remove this whole section to hide the read-aloud buttons in the UI.
endpoint = "https://api.example.com/v1"
api_key = "your-tts-api-key"
# e.g. "gpt-4o-mini-tts", or "elevenlabs/eleven_multilingual_v2" on gateways
# that expose ElevenLabs (better multilingual quality, which matters when the
# patient's language is the one being read aloud).
model = "gpt-4o-mini-tts"
voice = "alloy"

# ── Hosted service ───────────────────────────────────────────────────────
# Everything below turns the interpreter into a service with accounts. The
# standalone medical_translations app has none of it.

[auth]
# SQLite file holding accounts and the word ledger. Created on first run;
# the parent directory must already exist. Back this up: it is the only
# record of who has an account and who has paid.
database = "medical_saas.db"
# How long an emailed sign-in link stays valid.
magic_link_minutes = 60
# How long a session lasts before the user needs a new link.
session_days = 30
# Force the Secure cookie flag on or off. Left unset, it is on exactly when
# the request arrived over HTTPS (directly or via X-Forwarded-Proto), so
# local plain-HTTP development still signs in.
#secure_cookies = true

[email]
# The public origin of this deployment. Sign-in links are built from it, so
# it must be the address users actually reach — not the bind address.
base_url = "https://interpreter.example.com"
from_name = "Medical Interpreter"
from_address = "login@example.com"
# Resend API key (https://resend.com). Leave empty and sign-in links are
# written to the server log instead of delivered — fine for local work,
# useless in production.
resend_api_key = ""
# Development only, and refused when resend_api_key is set: also return the
# sign-in link in the HTTP response so a browser or test can follow it
# without an inbox.
dev_echo_link = false

[quota]
# Spoken words a free account may interpret in any rolling seven-day
# window. Both sides of the conversation draw on the same allowance, and
# the window is counted from each moment backwards — there is no reset
# hour. Paid accounts are unlimited.
free_words_per_week = 1000

[stripe]
# Step-by-step setup, local testing with the Stripe CLI, and a
# troubleshooting table are in README.md ("Setting up Stripe").
#
# Leave all three empty to run without paid plans: every account stays free
# and the upgrade button disappears. Test-mode and live-mode values are
# separate; mixing them is the usual reason a subscription never activates.
#
# Dashboard -> Developers -> API keys -> Secret key (sk_test_… / sk_live_…).
secret_key = ""
# Dashboard -> Product catalogue -> your product -> a RECURRING price
# (price_…). A one-off price cannot be subscribed to.
price_id = ""
# Dashboard -> Developers -> Webhooks -> your endpoint -> Signing secret
# (whsec_…). Specific to that one endpoint. Without it every delivery is
# refused, so no account could ever become paid.
#
# Point the endpoint at https://<your-host>/stripe/webhook and subscribe it
# to exactly these four events:
#   checkout.session.completed      first payment succeeded -> plan becomes paid
#   customer.subscription.created   subscription exists
#   customer.subscription.updated   renewals, plan and status changes
#   customer.subscription.deleted   subscription ended -> back to free
#
# Also save a Customer portal configuration once per mode (Settings ->
# Billing -> Customer portal), or /api/billing/portal cannot open and
# subscribers have no in-app way to cancel.
webhook_secret = ""
# What the landing page prints as the plan's price. Cosmetic only: Stripe
# charges whatever the price object above says and shows that amount at
# checkout, so keep this in step with it by hand. Left empty, the page says
# "Monthly" without naming a figure rather than risking a stale one.
#price_display = "$20 / month"
