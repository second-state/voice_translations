# Copy this file to config.toml and fill in your credentials.
# config.toml is git-ignored and must never be committed.

[server]
host = "127.0.0.1"
port = 8080

[audio]
# Silence duration (ms) that ends a sentence/utterance. Between-sentence
# pauses in conversation average ~500-1000ms; values below ~200ms will split
# on the silent closure of stop consonants (p/t/k) mid-word. Higher values
# (1200+) keep hesitant speech with thinking pauses together in one
# sentence, which lets the translator clean up fillers and self-corrections.
sentence_break_ms = 1200
# Utterances shorter than this (ms) are discarded as noise.
min_speech_ms = 250
# Force a sentence break if one utterance runs longer than this (ms).
max_utterance_ms = 30000
# Silero VAD speech probability above which a frame counts as speech (0-1).
# Lower it (e.g. 0.35) to capture quiet speakers far from the microphone;
# raise it (e.g. 0.6) in noisy rooms to reject non-speech sounds.
vad_positive_threshold = 0.5
# Silero VAD speech probability below which a frame counts as silence (0-1).
# Keep it below vad_positive_threshold; lower it together with the positive
# threshold for distant speakers (e.g. 0.25).
vad_negative_threshold = 0.35
# Audio (ms) prepended before the detected speech onset so the first
# syllable is not clipped.
pre_speech_pad_ms = 300

[languages]
# ISO 639-1 codes (en, ko, ja, zh, es, ...); full names are also accepted.
# Fallback when the ASR service does not report a detected language.
default_source = "en"
# Languages pre-selected in the UI.
default_targets = ["ko"]

[asr]
# OpenAI-compatible base URL; the server appends /audio/transcriptions.
endpoint = "https://api.example.com/v1"
api_key = "your-asr-api-key"
model = "whisper-1"

[llm]
# OpenAI-compatible base URL; the server appends /chat/completions.
endpoint = "https://api.example.com/v1"
api_key = "your-llm-api-key"
model = "gpt-4o-mini"
# How many past messages to include as translation context.
context_messages = 5
# Sampling temperature; omit to use the model's default.
#temperature = 0.3
