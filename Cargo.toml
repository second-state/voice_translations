# Two apps ship from this workspace, each a standalone binary with its own
# configuration file:
#   voice-translations    — the general-purpose translator (this package)
#   medical-translations  — the patient/clinician interpreter, built on this
#                           package as a library
# `cargo build --release` builds both into target/release/.
[workspace]
members = ["medical_translations"]
default-members = [".", "medical_translations"]

[package]
name = "voice-translations"
version = "0.2.0"
edition = "2021"
description = "Real-time speech transcription and translation over OpenAI-compatible ASR/LLM/TTS services"
repository = "https://github.com/second-state/voice_translations"
license = "Apache-2.0"

# The crate is both the bundled web app and a library that other Axum apps
# build domain-specific translators on (see `medical_translations`).
[lib]
name = "voice_translations"
path = "src/lib.rs"

[[bin]]
name = "voice-translations"
path = "src/main.rs"

[features]
# Assets are embedded by default so a released binary is self-contained: it
# runs from any directory with nothing beside it but a config file. When the
# source tree *is* present the binary still prefers `static/vendor/` on disk,
# so the assets can be swapped without a rebuild. Turn this off
# (`--no-default-features`) for a ~15 MB smaller binary that requires
# `static/vendor/` to be deployed alongside it.
default = ["embed-assets"]
# Compile the Silero VAD + onnxruntime-web assets into the binary and expose
# `assets::vendor_router()`. Dependent crates need this, since they cannot
# reach this crate's source tree at runtime.
embed-assets = []

[dependencies]
# Web server
axum = { version = "0.8", features = ["multipart"] }
tower-http = { version = "0.6", features = ["fs"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tokio-stream = "0.1"
futures = "0.3"
bytes = "1"

# Upstream HTTP (ASR + LLM)
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "multipart",
    "stream",
    "rustls-tls",
] }

# Serialization / config
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Errors / logging
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
