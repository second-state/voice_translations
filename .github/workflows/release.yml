# Build every app and publish them as a GitHub Release.
#
# Deliberately manual: releases are never cut by pushing code or a tag.
# Run it from Actions -> release -> Run workflow, give it the version to
# publish, and it tags the commit it ran against and publishes from there.
# Leave "publish" unchecked to build the archives without releasing them.
#
# Each app ships as its own archive per platform — one binary, its example
# config, and its README — because that is exactly what a deployment needs:
# the Silero VAD and onnxruntime assets are compiled into the executable, so
# there is nothing else to copy.
#
# Only first-party actions are used here (checkout, cache, artifacts) plus
# the `gh` CLI that is preinstalled on the runners: this workflow has access
# to the release token, so its dependency surface is kept as small as
# possible.
name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. v0.1.0 (tags the commit this runs against)"
        required: true
        type: string
      publish:
        description: "Publish a GitHub Release. Unchecked, it only builds the archives."
        type: boolean
        default: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # A build that fails its own tests is not a release candidate. This job
  # also rejects a bad or already-used version before anyone waits through
  # four platform builds.
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Check the version
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$VERSION' is not a version like v0.1.0" && exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null 2>&1; then
            echo "::error::tag $VERSION already exists; pick the next version" && exit 1
          fi
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "::error::release $VERSION already exists" && exit 1
          fi
          echo "releasing $VERSION from ${GITHUB_SHA:0:8}"
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: check-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
      - run: rustup update stable && rustup default stable && rustup component add rustfmt clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          # Dynamically linked against glibc 2.35, which covers Ubuntu 22.04
          # and Debian 12 and newer.
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          # Fully static: one file that runs on any Linux, including Alpine
          # and distroless containers. Prefer these when unsure.
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-22.04
          # arm64 servers — Graviton, Ampere, an ARM VPS, a Raspberry Pi.
          # Built on native arm64 runners rather than cross-compiled, so the
          # SQLite that rusqlite builds from C source is a first-class build
          # like any other.
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-22.04-arm
          # Apple Silicon, for running the apps on a development machine.
          # Intel Macs are not built: the remaining Intel runners queue for
          # a long time, and every current Mac is arm64.
          - target: aarch64-apple-darwin
            runner: macos-14
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: build-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Install the Rust toolchain
        run: |
          rustup update stable
          rustup default stable
          rustup target add ${{ matrix.target }}

      # rusqlite builds SQLite from C source, so a musl build needs a musl C
      # compiler as well as the Rust target.
      - name: Install the musl toolchain
        if: endsWith(matrix.target, '-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package each app
        shell: bash
        run: |
          set -euo pipefail
          version="${{ inputs.version }}"
          version="${version#v}"
          target="${{ matrix.target }}"
          mkdir -p dist

          # binary:source directory. The binary carries its assets and prompts
          # inside it; the config example and README are what a person needs
          # beside it.
          for pair in \
            "conf-translations:conf_translations" \
            "medical-translations:medical_translations" \
            "medical-saas:medical_saas" \
            "conf-saas:conf_saas"; do
            app="${pair%%:*}"
            dir="${pair##*:}"
            name="$app-$version-$target"
            stage="dist/$name"
            mkdir -p "$stage"
            cp "target/$target/release/$app" "$stage/"
            cp "$dir/config.example.toml" "$stage/"
            cp "$dir/README.md" "$stage/"
            tar -czf "dist/$name.tar.gz" -C dist "$name"
            rm -rf "$stage"
            echo "packaged dist/$name.tar.gz"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    needs: build
    # Unchecked "publish" stops after the build: the archives are attached to
    # the workflow run to download, but no tag and no release are created.
    if: inputs.publish
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksum every archive
        working-directory: dist
        run: sha256sum *.tar.gz | tee SHA256SUMS

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ inputs.version }}"
          version="${tag#v}"
          cat > notes.md <<EOF
          Four self-contained apps, built from this tag. Each archive holds
          one binary, its \`config.example.toml\`, and its README — the Silero
          VAD and onnxruntime assets are compiled into the binary, so there is
          nothing else to install.

          | App | What it is | Default port |
          | --- | --- | --- |
          | \`conf-translations\` | Conference-call translator, tuned per call type | 8080 |
          | \`medical-translations\` | Patient/clinician interpreter, tuned per specialty | 8090 |
          | \`medical-saas\` | The medical translator as a service: accounts, weekly quota, Stripe plans | 8100 |
          | \`conf-saas\` | Meeting Translator: the conference translator as the same service | 8110 |

          Pick \`x86_64-unknown-linux-musl\` unless you have a reason not to:
          it is statically linked and runs on any Linux. The \`-gnu\` build
          needs glibc 2.35 or newer.

          \`\`\`sh
          tar xzf medical-saas-$version-x86_64-unknown-linux-musl.tar.gz
          cd medical-saas-$version-x86_64-unknown-linux-musl
          cp config.example.toml config.toml   # add your endpoints and keys
          ./medical-saas
          \`\`\`

          Verify a download against \`SHA256SUMS\`:

          \`\`\`sh
          sha256sum -c SHA256SUMS --ignore-missing
          \`\`\`
          EOF

          # Creates the tag on the commit this run checked out, so the
          # release always matches the code that was built and tested.
          gh release create "$tag" \
            --target "$GITHUB_SHA" \
            --title "$tag" \
            --notes-file notes.md \
            --generate-notes \
            dist/*.tar.gz dist/SHA256SUMS
