[package]
name = "medical-saas"
version = "0.1.8"
edition = "2021"
description = "The medical translator as a hosted service: accounts, magic-link login, a rolling weekly word quota, and Stripe subscriptions"
license = "Apache-2.0"

[dependencies]
# The speech pipeline (VAD assets, ASR, streaming LLM translation, TTS) comes
# from the voice_translations library. `embed-assets` compiles the Silero VAD
# and onnxruntime-web files into this binary, since the library's `vendor/`
# tree is not reachable at runtime from a dependency.
voice-translations = { path = "..", features = ["embed-assets"] }

# The medical domain — specialties, translation rules, per-language clinical
# notes, and the prompt files behind them — comes from the standalone
# translator, so this crate carries none of it. What it adds is the account
# layer and the UI around it.
medical-translations = { path = "../medical_translations" }

# Web server
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

# Accounts: embedded SQLite, magic-link tokens, Stripe webhook signatures
rusqlite = { version = "0.32", features = ["bundled"] }
rand = "0.8"
hex = "0.4"
hmac = "0.12"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
urlencoding = "2"

# Upstream HTTP (Resend email, Stripe API)
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
] }

# Serialization / config
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Errors / logging
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
